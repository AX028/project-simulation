[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "project-simulation"
version = "1.0.0"
description = "A deterministic, headless fantasy RPG simulation framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.11,<4",
  "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
project-simulation = "project_simulation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_simulation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["project_simulation"]

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true
